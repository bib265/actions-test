name: Generate ascii artwork
on: push

jobs:
    ascii_job:
        runs-on: ubuntu-latest

        steps:
            - name: checkout repo
              uses: actions/checkout@v7
            
            - name: check files
              run: ls -ltra

            - name: Executing shell script for ascii art
              run: |
                  chmod +x ascii-script.sh
                  ./ascii-script.sh
            
            